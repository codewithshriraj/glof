<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c141c" />
      <stop offset="100%" stop-color="#070f16" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5de6ff" />
      <stop offset="100%" stop-color="#22b8cf" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b8c4ff" />
      <stop offset="100%" stop-color="#6c88ff" />
    </linearGradient>
  </defs>
  
  <!-- App Background -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)" stroke="#232b33" stroke-width="8" />
  
  <!-- Radar concentric circles -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#232b33" stroke-width="2" stroke-dasharray="8 8" />
  <circle cx="256" cy="256" r="120" fill="none" stroke="#232b33" stroke-width="2" stroke-dasharray="6 6" />
  <circle cx="256" cy="256" r="60" fill="none" stroke="#232b33" stroke-width="2" />
  
  <!-- Mountain & Glacial Lake Peak Geometry -->
  <polygon points="120,360 256,150 392,360" fill="none" stroke="#444654" stroke-width="6" />
  <polygon points="180,360 256,240 332,360" fill="#141c24" stroke="url(#blueGrad)" stroke-width="6" />
  
  <!-- Glacial Peak Cap (Snow/Ice) -->
  <polygon points="256,150 220,210 240,205 256,220 272,205 292,210" fill="url(#blueGrad)" />
  
  <!-- Satellite / Radar Node Core -->
  <circle cx="256" cy="256" r="28" fill="#070f16" stroke="url(#cyanGrad)" stroke-width="6" />
  <circle cx="256" cy="256" r="12" fill="#5de6ff" />
  
  <!-- Outburst Flood Warning Waveforms -->
  <path d="M 160 380 Q 208 360, 256 380 T 352 380" fill="none" stroke="url(#cyanGrad)" stroke-width="6" stroke-linecap="round" />
  <path d="M 180 405 Q 218 390, 256 405 T 332 405" fill="none" stroke="url(#cyanGrad)" stroke-width="4" stroke-linecap="round" opacity="0.7" />
  
  <!-- HUD Cardinal Target Markers -->
  <line x1="256" y1="56" x2="256" y2="88" stroke="#5de6ff" stroke-width="4" stroke-linecap="round" />
  <line x1="256" y1="424" x2="256" y2="456" stroke="#5de6ff" stroke-width="4" stroke-linecap="round" />
  <line x1="56" y1="256" x2="88" y2="256" stroke="#5de6ff" stroke-width="4" stroke-linecap="round" />
  <line x1="424" y1="256" x2="456" y2="256" stroke="#5de6ff" stroke-width="4" stroke-linecap="round" />
</svg>
