<script>
        // Simple OTP input logic
        const inputs = document.querySelectorAll('#otp-inputs input');
        
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                // Ensure only numbers
                e.target.value = e.target.value.replace(/[^0-9]/g, '');
                
                if (e.target.value.length === 1 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && e.target.value === '' && index > 0) {
                    inputs[index - 1].focus();
                }
            });
        });

        // Countdown Timer Logic
        let timeRemaining = 102; // 1 min 42 seconds
        const countdownEl = document.getElementById('countdown');
        
        const updateTimer = () => {
            const minutes = Math.floor(timeRemaining / 60);
            const seconds = timeRemaining % 60;
            countdownEl.innerHTML = `<span class="material-symbols-outlined text-[14px]">timer</span> ${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
            
            if (timeRemaining <= 15) {
                 countdownEl.classList.add('animate-pulse');
            }

            if (timeRemaining > 0) {
                timeRemaining--;
                setTimeout(updateTimer, 1000);
            } else {
                 countdownEl.innerHTML = `<span class="material-symbols-outlined text-[14px]">timer_off</span> EXPIRED`;
                 countdownEl.classList.remove('animate-pulse');
            }
        };

        setTimeout(updateTimer, 1000);
    </script>
